name: Oddzielna historia opisowa Ekstraklasy
on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sportlab-ekstraklasa-data
  cancel-in-progress: false
jobs:
  observations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Sprawdź kod przed pobraniem danych
        run: npm run check
      - name: Przywróć ostatnią niezmienną historię opisową
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-ekstraklasa.js restore
      - name: Odczytaj ostatnie 7 zakończonych dni UTC (maks. 10 żądań na minutę)
        run: node scripts/refresh-ekstraklasa.js
      - name: Sprawdź kod oraz zaktualizowany zbiór przed publikacją
        run: |
          npm run check
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { validateEkstraklasaHistory } from './src/server/ekstraklasa-history.js';
          validateEkstraklasaHistory(JSON.parse(await readFile('data/supplemental/ekstraklasa.json', 'utf8')));
          JS
      - name: Opublikuj tylko dane na oddzielnej gałęzi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-ekstraklasa.js publish
